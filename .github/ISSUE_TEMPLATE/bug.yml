name: Bug
description: Something on the site does not work as expected.
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the problem. Write in English.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (main)
        - Staging (dev)
        - Pull request preview
        - Local
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: "Chrome 140 on Android"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker - the site or a page is unusable
        - Major - a feature does not work
        - Minor - a workaround exists or it is cosmetic
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
